[project]
name = "dga2d"
version = "0.1.0"
description = "Directed Graph-Guided Automated Algorithm Design with Large Language Models"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "python-dotenv==1.2.1",
    "numba==0.63.1",
    "transformers==5.14.1",
    "peft==0.19.1",
    "accelerate==1.14.0",
]

[project.optional-dependencies]
cu126 = ["torch==2.6.0+cu126"]
cpu = ["torch==2.6.0+cpu"]

[dependency-groups]
dev = ["ruff==0.15.20"]

[tool.uv]
package = false
required-version = ">=0.12.23,<0.13"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
# Preserve the previous Python 3.13 environment during this migration.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "antlr4-python3-runtime==4.9.3",
    "anyio==4.12.1",
    "certifi==2025.11.12",
    "click==8.4.0",
    "colorama==0.4.6",
    "filelock==3.20.1",
    "fsspec==2025.12.0",
    "h11==0.16.0",
    "hf-xet==1.5.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.16.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "llvmlite==0.46.0",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.4.2",
    "packaging==25.0",
    "pillow==11.3.0",
    "psutil==7.2.2",
    "pygments==2.20.0",
    "pyyaml==6.0.3",
    "regex==2026.5.9",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "shellingham==1.5.4",
    "sympy==1.13.1",
    "tokenizers==0.22.2",
    "tqdm==4.67.1",
    "typer==0.25.1",
    "typing-extensions==4.15.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# PyTorch 2.6.0 CUDA wheels have platform-dependent metadata. Preserve the
# official Linux wheel requirements when locking from Windows as well.
# Source: https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp313-cp313-manylinux_2_28_x86_64.whl.metadata
[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.6.0+cu126"
requires-dist = [
    "filelock",
    "typing-extensions>=4.10.0",
    "setuptools; python_version >= \"3.12\"",
    "sympy==1.13.1; python_version >= \"3.9\"",
    "networkx",
    "jinja2",
    "fsspec",
    "nvidia-cuda-nvrtc-cu12==12.6.77; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cuda-runtime-cu12==12.6.77; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cuda-cupti-cu12==12.6.80; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cudnn-cu12==9.5.1.17; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cublas-cu12==12.6.4.1; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cufft-cu12==11.3.0.4; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-curand-cu12==10.3.7.77; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cusolver-cu12==11.7.1.2; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cusparse-cu12==12.5.4.2; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-cusparselt-cu12==0.6.3; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-nccl-cu12==2.21.5; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-nvtx-cu12==12.6.77; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "nvidia-nvjitlink-cu12==12.6.85; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "triton==3.2.0; platform_system == \"Linux\" and platform_machine == \"x86_64\"",
    "optree>=0.13.0; extra == \"optree\"",
    "opt-einsum>=3.3; extra == \"opt-einsum\"",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".git", ".model_cache", ".venv", "artifacts", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
